name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Read package version
        id: package
        shell: bash
        run: echo "version=$(node -p \"require('./packages/cli/package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.package.outputs.version }}"
      - name: Check npm version
        id: npm
        shell: bash
        run: |
          if npm view "rivelle@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.npm.outputs.published != 'true'
        working-directory: packages/cli
        run: npm publish --access public
